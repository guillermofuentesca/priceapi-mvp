services:
  # Web Service (API)
  - type: web
    name: priceapi-mvp
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: priceapi-db
          property: connectionString
      - key: REDIS_HOST
        value: localhost
      - key: REDIS_PORT
        value: 6379

databases:
  # PostgreSQL Database
  - name: priceapi-db
    databaseName: pricetracker_db
    user: pricetracker_user
    plan: free
    region: oregon