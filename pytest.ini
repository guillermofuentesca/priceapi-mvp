[pytest]
# Configuración de pytest para Price Tracker API

# Directorio de tests
testpaths = tests

# Patrón de archivos de test
python_files = test_*.py

# Patrón de funciones de test
python_functions = test_*

# Opciones por defecto
addopts = 
    -v
    --strict-markers
    --tb=short
    --asyncio-mode=auto

# Markers personalizados
markers =
    unit: Tests unitarios (funciones individuales)
    integration: Tests de integración (múltiples componentes)
    slow: Tests que tardan más tiempo
    auth: Tests de autenticación
    crud: Tests de operaciones CRUD
    endpoints: Tests de endpoints HTTP

# Asyncio
asyncio_mode = auto